[project]
name = "env-review"
version = "0.1.0"
description = "Exploratory, evidence-based audits of evaluation tasks and RL environments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_audit"]
