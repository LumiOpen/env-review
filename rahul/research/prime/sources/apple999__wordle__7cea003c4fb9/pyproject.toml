[project]
name = "wordle"
description = "Multi-turn Wordle played through a guess tool, with shaped solve + green-progress rewards."
tags = ["multi-turn", "tool-use", "games", "train", "eval"]
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["wordle/**", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 3
