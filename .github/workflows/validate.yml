name: Validate catalog and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m eval_audit.catalog validate
      - run: uv run python -m eval_audit.catalog index --output reports/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: env-review-index
          path: reports/index.json
