id: ER-93471fdf
dataset: gh:PrimeIntellect-ai/community-environments
revision: cf220ee86500e94b5415d8b226557ce5d950f1db
title: Prime Intellect hub allows untracked copies of environments — verifier bugs propagate silently to all forks
status: behavior_only
category: infrastructure
tasks:
  - id: mastermind
  - id: gptworld
  - id: nyt_connections
  - id: hanabi
problem:
  description: >
    The Prime Intellect Environments Hub allows any user to republish an
    environment under their own namespace without requiring attribution,
    version pinning, or a link back to the canonical source. When a verifier
    bug exists in the canonical community-environments submission, all hub
    copies inherit the same bug silently. There is no mechanism to notify
    fork authors of upstream fixes, no shared issue tracker, and no
    version relationship between copies. A training run using any hub copy
    is affected by the same reward-signal defects as the original.
  expected: >
    Hub forks should either: (a) track the upstream revision they were
    copied from so that bug fixes can be propagated; or (b) clearly mark
    forks as independent variants so users understand they are not
    receiving upstream fixes.
  actual: >
    The mastermind environment authored by xlr8harder appears on the hub
    under at least five namespaces: xlr8harder/mastermind,
    primeintellect/mastermind, juyoung/mastermind, prime-community/mastermind,
    and petern/mastermind. All share the same scoring.py with the latent
    ord()-48 index bug (ER-91c19cbf). Similarly, verifier defects found in
    gptworld (ER-0aef7d86), nyt_connections (ER-87102930), and hanabi
    (ER-074ce6c7) would affect any hub copy of those environments without
    the copy authors being aware.
evidence:
  - source: environments/mastermind/mastermind.py
    line_start: 1
    line_end: 1
    quote: >
      Git history confirms mastermind was added by xlr8harder in commit
      305d7e6 (2025-10-20). The same environment appears on the Prime
      Intellect hub under at least five user namespaces with no version
      attribution: xlr8harder/mastermind, primeintellect/mastermind,
      juyoung/mastermind, prime-community/mastermind, petern/mastermind.
    note: >
      Hub URLs observed: https://app.primeintellect.ai/dashboard/environments/xlr8harder/mastermind,
      primeintellect/mastermind, juyoung/mastermind, prime-community/mastermind, petern/mastermind.
validation:
  method: static
  summary: >
    Git log of community-environments confirms single authorship of mastermind
    (commit 305d7e6, author xlr8harder). Multiple hub namespaces for the same
    environment were observed by the reviewer. No version tracking or
    attribution mechanism was found in the hub interface or the environment
    package format. This finding describes a structural property of the hub,
    not a specific task defect — it is recorded to scope the blast radius of
    individual verifier findings.
  assumptions:
    - Hub copies share the same verifier code as the community-environments canonical source at the time of copying.
    - No hub-level patch or override mechanism exists that could silently fix bugs in copies.
  not_run:
    - Direct inspection of each hub copy's verifier code to confirm byte-for-byte identity with canonical source.
    - Review of hub documentation for any version-tracking or fork-attribution features.
provenance:
  discovered_by: static review and hub observation, 2026-10-20
discussion: >
  This finding is scoped as behavior_only because the hub's copy mechanism
  is a design property, not necessarily a defect. Its relevance to env-review
  is that findings filed against community-environments should be understood
  as affecting all hub copies of the same environment, not only the canonical
  submission. Reviewers auditing individual hub copies do not need separate
  findings if the verifier code is identical.
