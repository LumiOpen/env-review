title: llm_writing_detection pays up to 0.75 of the reward without looking at the requested topic; a nonsense reply scored 0.45
status: candidate
category: reward_shortcut
tasks:
  - id: llm_writing_detection
    path: environments/llm_writing_detection
problem:
  description: >
    Each task asks for a Wikipedia article on a given title. The reference
    answer is the human-written article. The rubric combines seven weighted
    functions. Five style penalties (total weight 0.45) and the LLM judge
    (weight 0.3) never see the prompt or the reference. Only similarity_reward
    (weight 0.25) compares the reply with the reference article. The style
    penalties are floored, so they contribute at least 0.345 for any text and
    exactly 0.45 for plain text without emojis, mixed quotes, bold/italic,
    mixed list markers or em-dashes. The judge prompt contains only the
    completion and asks whether it looks AI-generated, so a short off-topic
    reply the judge considers human-written gets the full 0.3. At most 0.25 of
    the reward depends on writing about the requested subject.
  expected: >
    The environment README says the task is to "write Wikipedia-style articles
    that avoid AI-detectable patterns while maintaining human-like writing
    quality", and the prompt asks for an article on a specific title. A reply
    that does not address the title should score well below an on-topic
    article.
  actual: >
    In our run, a fixed nonsense reply ("I think the answer is 0." plus
    \boxed{0}) scored 0.451 on all 5 tasks: every style penalty 1.0,
    similarity 0.005, judge term 0.0 because no judge model was available.
    Replying with each row's own human-written reference article scored 0.688.
    The reference itself lost points on quote_consistency (mean 0.88), so the
    "AI pattern" penalty also applies to the human reference text. With no
    judge, nonsense earns 66% of the reference's reward. With a working judge,
    the maximum topic-independent reward is 0.75 out of 1.0.
