validation:
  method: reproduction
  summary: >
    We installed the Environments Hub package primeintellect/llm-writing-detection
    0.1.0 in an isolated microVM (verifiers 0.3.1) and ran vf-eval on 5 tasks
    with a mock model, first replying with a fixed nonsense string and then
    with each row's reference answer. The cited hub files
    (llm_writing_detection.py, utils/reward_functions.py, pyproject.toml) are
    byte-identical to the pinned revision. Per-function means for both runs
    are in the witness. An agent then read the rubric and penalty functions to
    confirm that only similarity_reward uses the reference and that nothing
    uses the requested title. The topic-independent 0.75 maximum is
    arithmetic over the documented weights and penalty floors. It has not been
    measured with a real judge.
  assumptions:
    - The environment is presented as published, with the default rubric weights and a working judge model as documented in the README.
    - A reply that does not address the requested title should not receive most of the reward. The README's stated goal includes writing the requested Wikipedia-style article, not only avoiding style patterns.
  not_run:
    - No real LLM judge was configured. Whether gpt-4.1-mini (the default) labels short or off-topic replies as human-written is not measured.
    - No training run demonstrated that a policy learns to exploit the topic-independent reward.
    - Hub copies under other namespaces were not compared.
  reproducer: env/PrimeIntellect-ai/community-environments/evidence/ER-5c3e9a71/witness.json
provenance:
  discovered_by: Daniel Zautner's Prime Environments Hub audit (automated gold-vs-garbage reward check, then AI-agent code review; not independently human-validated)
  experiment: experiments/prime-hub-audit
discussion: >
  The README lists the weights and penalty ranges, so the floor is documented
  rather than hidden. This finding is about how well those weights fit the
  stated task. Possible fixes: make style terms multiply a topic or similarity
  term instead of adding to it, or give the judge the requested title and ask
  whether the reply is an on-topic article. The reference reply scored
  similarity 1.0 in our run, so the reply text did reach the reward functions;
  the measured floor is not an artifact of message parsing.
