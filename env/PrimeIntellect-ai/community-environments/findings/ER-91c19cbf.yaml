dataset: gh:PrimeIntellect-ai/community-environments
revision: cf220ee86500e94b5415d8b226557ce5d950f1db
title: mastermind score_guess crashes with IndexError on non-digit characters in string guesses
status: confirmed
category: grader_mismatch
tasks:
  - id: mastermind
problem:
  description: >
    In the string branch of score_guess, character values are computed as
    ord(char) - 48 and used as indices into counting arrays ca and cg of
    length c (the number of colours, typically 6-8). If the answer or guess
    string contains any character whose ASCII value minus 48 is negative or
    >= c — such as a space (ord(' ')-48 = -16), a letter, or a newline — the
    index is out of bounds and raises an IndexError. This crashes the verifier
    silently: the environment's exception handler returns 0 reward for a
    potentially correct guess.
  expected: >
    score_guess should validate that all characters in answer and guess are
    digit characters in the range ['0', '0'+c-1] before indexing, or use
    the integer branch for safety.
  actual: >
    Lines 28-31 compute ia = ord(a) - 48 and ig = ord(g) - 48 and
    immediately use them as array indices with no bounds check. Any
    whitespace or non-digit character (from model output parsing) causes
    an IndexError and a false-negative reward of 0.
evidence:
  - source: environments/mastermind/utils/scoring.py
    line_start: 17
    line_end: 37
    quote: |
      if isinstance(answer, str) and isinstance(guess, str):
          L = len(answer)
          black = 0
          ca = [0] * c
          cg = [0] * c
          for i in range(L):
              a = answer[i]
              g = guess[i]
              if a == g:
                  black += 1
              else:
                  ia = ord(a) - 48
                  ig = ord(g) - 48
                  ca[ia] += 1
                  cg[ig] += 1
          white = 0
          for i in range(c):
              ai = ca[i]
              gi = cg[i]
              white += ai if ai < gi else gi
          return black, white
validation:
  method: static
  summary: >
    Static analysis of scoring.py lines 28-29 confirms that ord(a) - 48 is
    used as a direct array index into ca/cg of length c without bounds
    checking. For c=6 (default), valid indices are 0-5 (characters '0'-'5').
    A space character gives index -16 (negative index — wraps in Python,
    corrupting the count array). A letter 'A' gives index 17 (out of range,
    IndexError). Parsing model output as a guess string without stripping
    whitespace or validating characters is the triggering condition.
  assumptions:
    - The calling code passes model output directly to score_guess as a string without sanitisation.
    - The exception is caught upstream and mapped to reward 0.0.
  not_run:
    - End-to-end confirmation that the model parser produces strings with non-digit characters in practice.
provenance:
  discovered_by: AI-assisted static code review, 2026-10-20
discussion: >
  Fix: add `if not (0 <= ia < c and 0 <= ig < c): raise ValueError(...)` after
  lines 28-29, or strip and validate the guess string before the call.
  Alternatively, convert strings to int lists before calling score_guess.
