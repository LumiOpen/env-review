validation:
  method: static
  summary: Read all 102014 rows of the pinned snapshot and confirmed 0.625 is the maximum pass rate
    anywhere, then tabulated total_rollouts and the per-denominator maximum across the 30180 math
    rows. For the dispersion test, took every prompt published exactly twice whose copies share a
    reference answer and report 8 rollouts each (1700 pairs), asserted passrate equals
    total_correct_rollouts / total_rollouts on each, and compared the observed gap between the two
    correct counts against its exact null. Conditioning on the pooled correct count makes the split
    hypergeometric, so the null needs no estimate of the underlying pass rate and no asymptotic
    approximation. The deficit is spread across the whole distribution rather than concentrated at
    zero - gaps of 0 and 1 are over-represented (32.4% and 43.4% against 21.9% and 35.6% expected)
    and every gap of 2 or more is under-represented - so it is not a subset of rows whose metadata
    was copied verbatim.
  assumptions:
  - The dispersion null assumes each copy's correct count came from its own independent rollouts of a
    shared policy. That is the assumption being tested, and it is rejected.
  - Rows are compared as published. No claim is made about which copy of a duplicated prompt is the
    more accurate measurement.
  not_run:
  - The mechanism behind the correlation is not established. Shared or overlapping rollouts between
    copies, a pass rate derived from a larger pool and re-expressed as k/n, and a scoring pass run
    once per deduplicated problem would all produce it, and the published columns cannot distinguish
    them.
  - No rollouts were generated and the dataset's own verifier was not run.
  reproducer: scripts/check_dolci_dispersion.py
provenance:
  discovered_by: Kai Hakala
  experiment: env/allenai/Dolci-Think-RL-7B/runs/2026-10-20-duplicate-screen
discussion: 'The practical consequence is that a threshold on this column is softer than it reads.
  Taking the published numbers at face value as 8-rollout estimates, the probability that a prompt of
  true pass rate p is recorded at or below the 5/8 release cut is 68% at p=0.6, 45% at p=0.7, 32% at
  p=0.75, 20% at p=0.8 and 4% at p=0.9, so the retained set is a soft difficulty band rather than a
  hard one. The dispersion result cuts the other way and is the more interesting half: because the
  copies are not independent, their close agreement cannot be used to argue the published pass rates
  are precise. Settling this needs the release scoring configuration, not more of the published data.'
