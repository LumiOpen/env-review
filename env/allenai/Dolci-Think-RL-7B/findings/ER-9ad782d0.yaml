problem:
  description: Every row publishes passrate together with total_correct_rollouts and total_rollouts,
    and no row in the whole dataset exceeds 0.625, which is 5 of 8. The column therefore records a
    difficulty screen applied before release, and it is the natural field to reuse when selecting or
    weighting prompts for training. It does not support that use. The denominator varies by row, 14
    math rows carry a pass rate computed from zero rollouts, and copies of one prompt agree with each
    other far more closely than independent sampling of one policy allows, so the numbers are neither
    equally precise nor independent measurements.
  expected: A per-row difficulty label is measured the same way on every row, so that one threshold
    means the same thing everywhere and two measurements of one prompt differ only by sampling error.
  actual: 'Among the 30180 math rows, total_rollouts takes every value from 0 to 8: 14 rows at 0, 28
    at 1, 127 at 2, 202 at 3, 385 at 4, 765 at 5, 1459 at 6, 5130 at 7 and 22070 at 8. The 14 rows
    with zero rollouts publish passrate 0.0 from no measurement at all, and would be kept by any
    filter that selects unsolved prompts. The release threshold is a single value applied to all of
    them: the maximum pass rate at each denominator is exactly the largest multiple of 1/n at or
    below 0.625 - 0.500 at n=2, 0.333 at n=3, 0.500 at n=4, 0.600 at n=5, 0.500 at n=6, 0.571 at n=7
    and 0.625 at n=8 - so a prompt measured 5 times faced a different effective cut than one measured
    8 times. Separately, among the 1700 prompts published exactly twice with the same reference and 8
    rollouts on both copies, the mean gap between the two correct counts is 0.996 rollouts where
    independent sampling of a shared policy requires 1.462 (ratio 0.68, z = -16.5), so the copies are
    positively correlated rather than independent re-measurements.'
