title: Equivalent reference answers written in different LaTeX record different pass rates on identical prompts
status: behavior_only
category: grader_mismatch
tasks:
- id: AceReason-Math_filtered-request-90-87
  config: default
  split: train
  row_index: 1234
- id: MathSub-30K_filtered-request-273-7
  config: default
  split: train
  row_index: 9989
problem:
  description: 38 groups of byte-identical math prompts carry reference answers that are the same
    value written differently - a brace, a space, a degree sign, a unit word. In 30 of those groups
    the copies also record different pass rates, which is consistent with the scoring run comparing
    answer strings in a way that the notation changes. If so, part of what passrate measures is how
    the reference was typed rather than how hard the problem is, and the same comparison would apply
    to rollouts generated against these rows during training.
  expected: Two references denoting the same value are scored the same way, so the recorded pass rate
    for one prompt does not depend on which copy of the reference a row happens to carry.
  actual: 'The sharpest case is a single space. The tangent-line problem is published twice with the
    same prompt; the copy whose reference is written "2\sqrt 2" records 0 of 8 rollouts correct, and
    the copy written "2\sqrt{2}" records 5 of 8. Similar pairs: "20^\circ" at 0.125 against "20" at
    0.500; "1600" at 0.125 against "1600 \text{ square centimeters}" at 0.500; "5 \sqrt{6}" at 0.000
    against "5\sqrt{6}" at 0.286; "a=-n^{2}" at 0.000 against "-n^{2}" at 0.375. Leading and trailing
    whitespace alone moves it, with " m^2 " at 0.429 against "m^2" at 0.143.'
