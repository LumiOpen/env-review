validation:
  method: static
  summary: Grouped the 30180 math rows of the pinned snapshot by byte-identical prompt and compared
    reference answers after collapsing cosmetic LaTeX differences. 38 groups differ only in notation;
    30 of those also differ in recorded pass rate. The normalizer is deliberately lenient, so it
    over-assigns groups to this class rather than to the contradictory-reference class covered by
    ER-a3060c49; every group in this finding was read by hand to confirm the two forms denote the
    same value.
  assumptions:
  - The published pass rates were produced by one scoring configuration across all rows, so the gap
    is attributable to the row rather than to the run.
  not_run:
  - Execution of the dataset's own verifier on either notation
  - Any rollout or model generation
  reproducer: src/eval_audit/duplicate_screen.py
provenance:
  discovered_by: Kai Hakala
  experiment: env/allenai/Dolci-Think-RL-7B/runs/2026-10-20-duplicate-screen
discussion: Held at behavior_only because the grader was not run, and because notation is demonstrably
  not the only driver of the gap. One group carries "198^\circ" twice and "198" once, recording 0.625,
  0.250 and 0.250, so the two degree-sign copies disagree with each other. Attributing any single gap
  to the grader requires running it; see ER-9ad782d0 for the separate problem that these pass rates are
  not comparable across rows in the first place.
