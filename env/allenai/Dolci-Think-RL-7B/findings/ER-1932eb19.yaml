problem:
  description: 174 rows in the math subset carry the literal string "-1" in ground_truth. Two of them
    duplicate a prompt that is also published with a real answer, which shows "-1" is a failed answer
    extraction stored as a label rather than the answer to the problem. 165 of the 174 nevertheless
    record a non-zero pass rate, so rollouts were marked correct against the placeholder.
  expected: Every row carries the answer to its problem, or is withheld if the answer could not be
    extracted.
  actual: '"-1" is used as an extraction-failure placeholder. Row 7896 labels the inscribed-triangle
    problem -1 while its byte-identical duplicate at row 4315 labels it 554; row 7910 labels the cube
    reflection problem -1 while its duplicate at row 8576 labels it 230. In both pairs the placeholder
    row records pass rate 0.000 and the real-answer row records 0.625 and 0.333. Across all 174 rows,
    165 record a non-zero pass rate and 9 record zero, so most of these rows both withhold the correct
    answer and reward some other string for matching -1.'
