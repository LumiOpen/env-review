validation:
  method: static
  summary: Counted exact "-1" values in ground_truth across the 30180 math rows of the pinned snapshot
    (174 rows), split them by whether passrate is zero (9) or non-zero (165), and grouped all math rows
    by byte-identical prompt to find the two cases where a placeholder row is duplicated by a row
    carrying a real answer. No empty, null or "N/A" reference values exist in the subset, so "-1" is
    the only placeholder form present.
  assumptions:
  - -1 is not the intended answer to the two adjudicated problems; both are counts or lengths that
    cannot be negative.
  - The remaining 172 rows are flagged by the shared placeholder value, not individually adjudicated.
  not_run:
  - Execution of the dataset's own verifier against the "-1" rows
  - Independent solution of the 172 unadjudicated problems
  reproducer: src/eval_audit/duplicate_screen.py
provenance:
  discovered_by: Kai Hakala
  experiment: env/allenai/Dolci-Think-RL-7B/runs/2026-10-20-duplicate-screen
discussion: The non-zero pass rates are the part worth resolving upstream. They imply the scoring run
  accepted some completion as matching "-1", which would positively reinforce a wrong answer on 165 rows.
  Confirming the mechanism needs the dataset's own verifier, which was not run here.
