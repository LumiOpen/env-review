problem:
  description: The prompt says the entire response must use lowercase letters, while the stored assistant message begins with uppercase text inside `<think>`.
  expected: If “entire response” includes the published assistant message, its reasoning and final answer should both satisfy the casing constraint.
  actual: The final answer after `</think>` is lowercase, but the preceding reasoning begins “Okay” and contains other capitals. The data card does not specify whether IF constraints exempt `<think>`.
evidence:
  - source: data/train-00086-of-00156.parquet
    note: Global train row 1264375, user message; local shard row 13935.
    quote: Your entire response should be in English, and in all lowercase letters. No capital letters are allowed.
  - source: data/train-00086-of-00156.parquet
    note: Same row, assistant message starts with this reasoning text.
    quote: <think>Okay, let me see. Bruce got $71 from his aunt for clothes.
  - source: data/train-00086-of-00156.parquet
    note: The assistant's final answer after `</think>` begins in lowercase.
    quote: bruce’s aunt gave him 71 dollars to spend on clothes at the mall.
validation:
  method: static
  summary: Compared the exact instruction to the complete stored assistant content and to the post-`</think>` answer. An exact-phrase full-source scan found 4566 rows with this think-only capitalization mismatch among 4571 matching lowercase prompts.
  assumptions:
    - The published `<think>` block is part of the SFT assistant message, as stored in `messages`.
  not_run:
    - Training or scoring behavior that might treat `<think>` as exempt from user-facing constraints.
