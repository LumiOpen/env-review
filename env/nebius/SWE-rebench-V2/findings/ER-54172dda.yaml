problem:
  description: >
    The solver-visible problem asks for the comma-style rule to handle ignored
    elements in multiline array destructuring. Both designated FAIL_TO_PASS
    tests instead exercise an exit-on-fatal-error CLI option. The reference
    patch bundles implementations of both behaviors, allowing it to validate
    while leaving the task's positive reward checks unrelated to the stated
    bug.
  expected: >
    The target tests that determine positive task reward should exercise the
    requested comma-style behavior, so a permitted implementation that fixes
    ignored multiline array elements can receive credit.
  actual: >
    The two FAIL_TO_PASS identifiers are "should not change exit code if no
    fatal errors are reported" and "should exit with exit code 1 if no fatal
    errors are found, but rule violations are found". The corresponding test
    patch invokes --exit-on-fatal-error and asserts process exit codes 0 and 1.
