    def upsert_pricing_assumptions(
        product_id: str,
        assumptions: list,
        expected_updated_at: str = None,
    ):
        """原子新增或更新产品定价情景，并维护唯一基准与产品乐观锁时间戳。

        Args:
            product_id: 产品统一 ID。
            assumptions: 参数对象列表，每项含情景代码、四项率值、基准标志、依据、来源文件和生效日。
            expected_updated_at: 可选产品当前 updated_at；不一致时拒绝写入以避免并发覆盖。

        Returns:
            包含 created、updated、benchmark_assumption_id 和 warnings 的写入结果字典。
        """
        if not assumptions:
            raise ValueError("assumptions 至少包含一项")
        scenario_codes = [item.get("scenario_code") for item in assumptions]
        if len(set(scenario_codes)) != len(scenario_codes):
            raise ValueError("同一请求中 scenario_code 不能重复")
        for item in assumptions:
            _validate_assumption(item)
        created, updated, warnings = [], [], []
        now = datetime.now(timezone(timedelta(hours=8))).isoformat(timespec="seconds")
        with _con() as connection:
            connection.execute("BEGIN IMMEDIATE")
            product = _require_product(connection, product_id)
            if expected_updated_at is not None and product["updated_at"] != expected_updated_at:
                raise ValueError(f"乐观锁冲突：当前 updated_at 为 {product['updated_at']}")
            existing_benchmark = connection.execute(
                "SELECT assumption_id,scenario_code FROM pricing_assumptions WHERE product_id=? AND is_benchmark=1",
                (product_id,),
            ).fetchall()
            requested_benchmarks = [item for item in assumptions if item["is_benchmark"]]
            if len(requested_benchmarks) > 1:
                raise ValueError("同一产品最多只能提交一个 is_benchmark=true 的参数")
            if requested_benchmarks:
                benchmark_code = requested_benchmarks[0]["scenario_code"]
                if any(row["scenario_code"] != benchmark_code for row in existing_benchmark):
                    raise ValueError("产品已存在其他基准参数；请更新 baseline，不得以压力情景替换基准")
            for item in assumptions:
                old = connection.execute(
                    "SELECT assumption_id FROM pricing_assumptions WHERE product_id=? AND scenario_code=?",
                    (product_id, item["scenario_code"]),
                ).fetchone()
                if old is None:
                    assumption_id = f"ASM-{product_id.replace('PROD-', '')}-{datetime.now().strftime('%y%m%d%H%M%S%f')[-12:]}-{len(created) + 1}"
                    connection.execute(
                        "INSERT INTO pricing_assumptions (assumption_id,product_id,scenario_code,pricing_interest_rate,expense_rate,surrender_lapse_rate,net_investment_yield,is_benchmark,source_basis,source_document_id,effective_date,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?)",
                        (assumption_id, product_id, item["scenario_code"], item["pricing_interest_rate"], item["expense_rate"], item["surrender_lapse_rate"], item["net_investment_yield"], 1 if item["is_benchmark"] else 0, item["source_basis"], item["source_document_id"], item["effective_date"], now),
                    )
                    created.append({"assumption_id": assumption_id, "scenario_code": item["scenario_code"]})
                else:
                    assumption_id = old["assumption_id"]
                    connection.execute(
                        "UPDATE pricing_assumptions SET pricing_interest_rate=?,expense_rate=?,surrender_lapse_rate=?,net_investment_yield=?,is_benchmark=?,source_basis=?,source_document_id=?,effective_date=?,created_at=? WHERE assumption_id=?",
                        (item["pricing_interest_rate"], item["expense_rate"], item["surrender_lapse_rate"], item["net_investment_yield"], 1 if item["is_benchmark"] else 0, item["source_basis"], item["source_document_id"], item["effective_date"], now, assumption_id),
                    )
                    updated.append({"assumption_id": assumption_id, "scenario_code": item["scenario_code"]})
            connection.execute("UPDATE insurance_products SET updated_at=? WHERE product_id=?", (now, product_id))
            benchmark = connection.execute(
                "SELECT assumption_id FROM pricing_assumptions WHERE product_id=? AND is_benchmark=1",
                (product_id,),
            ).fetchall()
            if len(benchmark) > 1:
                raise ValueError("写入后出现多个基准参数，事务已回滚")
            if not benchmark:
                warnings.append("当前产品尚未设置基准参数，盈利计算将不可用")
        return {"created": created, "updated": updated, "benchmark_assumption_id": benchmark[0]["assumption_id"] if benchmark else None, "warnings": warnings}


