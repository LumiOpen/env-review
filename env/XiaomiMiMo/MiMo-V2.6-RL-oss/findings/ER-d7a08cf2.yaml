    def _validate_assumption(item):
        required = {
            "scenario_code",
            "pricing_interest_rate",
            "expense_rate",
            "surrender_lapse_rate",
            "net_investment_yield",
            "is_benchmark",
            "source_basis",
            "source_document_id",
            "effective_date",
        }
        missing = sorted(required - set(item))
        if missing:
            raise ValueError(f"assumptions 缺少字段: {', '.join(missing)}")
        if not item["scenario_code"].strip():
            raise ValueError("scenario_code 不能为空")
        if not 0 <= item["pricing_interest_rate"] <= 1:
            raise ValueError("pricing_interest_rate 必须在 0 到 1 之间")
        if not 0 <= item["expense_rate"] <= 1:
            raise ValueError("expense_rate 必须在 0 到 1 之间")
        if not 0 <= item["surrender_lapse_rate"] <= 1:
            raise ValueError("surrender_lapse_rate 必须在 0 到 1 之间")
        if not -1 <= item["net_investment_yield"] <= 1:
            raise ValueError("net_investment_yield 必须在 -1 到 1 之间")
        if not item["source_basis"].strip() or not item["source_document_id"].strip():
            raise ValueError("source_basis 和 source_document_id 不能为空")
        _validate_date(item["effective_date"], "effective_date")
        if item["scenario_code"] == "baseline" and not item["is_benchmark"]:
            raise ValueError("baseline 必须设置 is_benchmark=true")
        if item["scenario_code"] != "baseline" and item["is_benchmark"]:
            raise ValueError("压力或归档情景不能覆盖 baseline，也不能设置为基准")
