    def post_inventory_adjustment(
        org_id: str,
        facility_id: str,
        item_id: str,
        posting_date: str,
        approval_doc_no: str,
        approval_line_no: int = 1,
        *,
        qty_delta: float,
        reason_code: str,
        memo: str,
        idempotency_key: str,
    ) -> dict:
        """Post an approved inventory adjustment with cost calculation and idempotent replay protection.

        Args:
            org_id: Inventory organization identifier receiving the adjustment.
            facility_id: Warehouse or inventory facility identifier receiving the posting.
            item_id: Active canonical inventory item identifier.
            posting_date: ERP posting date in YYYY-MM-DD format.
            approval_doc_no: Unique OA approval document number stored as the source document.
            approval_line_no: Positive OA approval line number stored as the source line.
            qty_delta: Signed adjustment quantity with at most four decimal places.
            reason_code: COUNT_LOSS, COUNT_GAIN, MEASUREMENT_ERROR, or SCRAP_CONFIRMATION.
            memo: Business explanation saved with the ledger entry.
            idempotency_key: Caller-supplied unique key persisted with the entry and used for safe retries.

        Returns:
            A dictionary describing the posted ledger entry and whether this request created it.
        """
        _parse_date(posting_date, "posting_date")
        quantity = _decimal_quantity(qty_delta)
        if reason_code not in _REASON_CODES:
            raise ValueError("reason_code must be COUNT_LOSS, COUNT_GAIN, MEASUREMENT_ERROR, or SCRAP_CONFIRMATION")
        if reason_code in {"COUNT_LOSS", "SCRAP_CONFIRMATION"} and quantity > 0:
            raise ValueError(f"{reason_code} requires a negative qty_delta")
        if reason_code == "COUNT_GAIN" and quantity < 0:
            raise ValueError("COUNT_GAIN requires a positive qty_delta")
        if approval_line_no < 1:
            raise ValueError("approval_line_no must be positive")
        if not all(value.strip() for value in (org_id, facility_id, item_id, approval_doc_no, memo, idempotency_key)):
            raise ValueError("org_id, facility_id, item_id, approval_doc_no, memo, and idempotency_key are required")
        if len(idempotency_key) > 120:
            raise ValueError("idempotency_key cannot exceed 120 characters")
