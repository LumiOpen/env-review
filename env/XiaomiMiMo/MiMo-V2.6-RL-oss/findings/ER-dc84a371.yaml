problem:
  description: Substantive LLM criteria have explicit weights totaling 1.0, while a non-gate sanity rule
    omits its weight and therefore receives the default 1.0.
  expected: Review whether rewarding preserved/available inputs with half of the score is intentional;
    this record does not assume that reward must have a zero baseline.
  actual: When the source rule scores 1 and all substantive LLM criteria score 0, the standalone weighted
    score is 1/(1+1)=0.5. The supplied initial data satisfies the source rule predicates.
