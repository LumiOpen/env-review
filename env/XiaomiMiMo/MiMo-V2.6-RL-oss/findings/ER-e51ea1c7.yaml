    def record_cecl_approval(recommendation_id: str, reviewer_id: str, reviewer_role: str, decision: str, approved_reserve_cents: int = None, evidence_reference: str = "", exception_detail: str = None, event_timestamp: str = "", idempotency_key: str = "") -> dict:
        """Record an immutable CECL approval decision and update recommendation state atomically.

        Args:
            recommendation_id: Recommendation being reviewed.
            reviewer_id: Human or service principal recording the decision.
            reviewer_role: Governed reviewer role.
            decision: approved, approved_with_exception, rejected, or held.
            approved_reserve_cents: Nonnegative approved amount for approved decisions, otherwise null.
            evidence_reference: Workpaper, memo, or committee evidence reference.
            exception_detail: Required explanation for approved_with_exception and optional for held.
            event_timestamp: ISO-8601 event timestamp.
            idempotency_key: Caller key preventing duplicate posting of the same decision.
        Returns:
            Event and state transition metadata, including replayed status.
        """
        decisions = {"approved", "approved_with_exception", "rejected", "held"}; roles = {"finance", "controller", "credit_committee", "internal_audit", "external_audit_support", "system_posting"}
        if decision not in decisions: raise ValueError("decision must be approved, approved_with_exception, rejected, or held")
        if reviewer_role not in roles: raise ValueError("reviewer_role is not supported")
