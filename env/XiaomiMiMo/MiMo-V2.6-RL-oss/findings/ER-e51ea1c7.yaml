problem:
  description: The task forbids changes to unrelated recommendations and event history. A valid held decision
    on an unrelated already-held recommendation appends a committed event without changing any grading
    evidence.
  expected: Scoring compliance with the explicit history restriction requires distinguishing the additional
    unrelated event from an otherwise identical compliant episode.
  actual: The unrelated balance check observes six unchanged fields, the history check observes one existing
    target event, and the two operation checks observe the target recommendation only. A fresh unrelated
    held event and updated_at are unobserved. This establishes a compliance gap, not a wrong answer or
    an unsolvable task.
