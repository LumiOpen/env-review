    from pathlib import Path
    import sqlite3

    RECOMMENDATION_ID = "REC-2025Q3-003"
    EVIDENCE_REFERENCE = "CC-AGENDA-2025-10-29/ITEM-04"
    RATIONALE = "Credit committee requested independent support for the 24-month hotel stabilization and 2.5% disposition-cost assumptions."

    def _connect(ws):
        path = Path(ws).parent / "system" / "cecl_governance_ledger" / "state.db"
        if not path.exists():
            return None
        connection = sqlite3.connect(path)
        connection.row_factory = sqlite3.Row
        return connection

    def check_held_recommendation_unapproved_unposted(ws):
        connection = _connect(ws)
        if connection is None:
            return {"score": 0, "detail": "CECL governance ledger is missing"}
        row = connection.execute("SELECT approval_status, recommended_reserve_cents, approved_reserve_cents, posted_reserve_cents, reporting_period_end FROM cecl_reserve_recommendations WHERE recommendation_id = ?", (RECOMMENDATION_ID,)).fetchone()
        connection.close()
        expected = ("held", 692541018, None, None, "2025-09-30")
        actual = tuple(row) if row is not None else None
        if actual == expected:
            return {"score": 1, "detail": "Target recommendation is held with its analytical amount retained and no approval or posting"}
        return {"score": 0, "detail": f"Unexpected target recommendation state: {actual!r}"}

    def check_credit_committee_event(ws):
        connection = _connect(ws)
        if connection is None:
            return {"score": 0, "detail": "CECL governance ledger is missing"}
        rows = connection.execute("SELECT event_id, reviewer_role, event_type, event_timestamp, decision, exception_flag, exception_detail, evidence_reference, event_comment FROM cecl_review_events WHERE recommendation_id = ? ORDER BY event_timestamp, event_id", (RECOMMENDATION_ID,)).fetchall()
        connection.close()
        def rationale_matches(value):
            text = (value or "").lower()
            required = ("independent support", "24-month", "stabilization", "2.5%", "disposition-cost")
            return all(token in text for token in required)
        matches = [row for row in rows if row["reviewer_role"] == "credit_committee" and row["event_type"] == "credit_committee_review" and row["decision"] == "held" and row["exception_flag"] == 1 and row["evidence_reference"] == EVIDENCE_REFERENCE and rationale_matches(row["exception_detail"]) and isinstance(row["event_comment"], str) and row["event_comment"].startswith("Idempotency-Key: ") and len(row["event_comment"].split(": ", 1)[1].strip()) >= 8]
        markers = [row["event_comment"] for row in rows if row["event_comment"]]
        if len(rows) >= 2 and len(matches) == 1 and len(set(markers)) == len(markers):
            if matches[0]["event_timestamp"] > "2025-10-25T12:44:00Z":
                return {"score": 1, "detail": "A new immutable credit-committee hold event has the required evidence, rationale, and unique idempotency marker"}
        return {"score": 0, "detail": "Required new credit-committee hold event was not found"}

    def check_unrelated_recommendations_unchanged(ws):
        connection = _connect(ws)
        if connection is None:
            return {"score": 0, "detail": "CECL governance ledger is missing"}
        rows = connection.execute("SELECT recommendation_id, approval_status, recommended_reserve_cents, approved_reserve_cents, posted_reserve_cents, posting_reference FROM cecl_reserve_recommendations WHERE recommendation_id <> ? ORDER BY recommendation_id", (RECOMMENDATION_ID,)).fetchall()
        connection.close()
        expected = [("REC-2024Q3-H03", "held", 71358206, 69000017, None, None), ("REC-2024Q4-H01", "held", 49731842, None, None, None), ("REC-2024Q4-H02", "held", 28374619, 28194763, 28150013, "ARCHIVE/2024/Q4/POST-03"), ("REC-2025Q3-001", "posted", 541287631, 525000000, 525000000, "JE-ACR-2025Q3-184"), ("REC-2025Q3-002", "posted", 488320477, 475000000, 475000000, "JE-ACR-2025Q3-185"), ("REC-2025Q3-004", "posted", 376499264, 370000000, 370000000, "JE-ACR-2025Q3-191"), ("REC-2025Q3-005", "posted", 385113152, 385000000, 380000000, "JE-ACR-2025Q3-192")]
        if [tuple(row) for row in rows] == expected:
            return {"score": 1, "detail": "All unrelated recommendation balances and statuses remain unchanged"}
        return {"score": 0, "detail": "An unrelated recommendation changed"}

    def check_existing_event_history_unchanged(ws):
        connection = _connect(ws)
        if connection is None:
            return {"score": 0, "detail": "CECL governance ledger is missing"}
        row = connection.execute("SELECT reviewer_id, reviewer_role, event_type, event_timestamp, decision, exception_flag, exception_detail, evidence_reference, event_comment FROM cecl_review_events WHERE event_id = ?", ("EVT-2025Q3-004",)).fetchone()
        connection.close()
        expected = ("person_sarah_chen", "finance", "recommendation_submitted", "2025-10-25T12:44:00Z", "held", 1, RATIONALE, EVIDENCE_REFERENCE, "Analytical recommendation remains unchanged while additional evidence is assembled.")
        if row is not None and tuple(row) == expected:
            return {"score": 1, "detail": "The pre-existing finance hold event remains unchanged"}
        return {"score": 0, "detail": "The pre-existing event history was changed"}
