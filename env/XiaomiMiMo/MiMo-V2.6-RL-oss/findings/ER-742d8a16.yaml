problem:
  description: Initial candidate alleged that an agent could publish source_reconciled=1 despite unmatched
    upstream records because the verifier trusted that flag.
  expected: The publishing operation must derive source_reconciled from actual reconciliation state, and
    grading must reject a zero flag.
  actual: The publishing tool counts unmatched records and sets reconciled=0 when any exist, even if require_reconciliation=False.
    With require_reconciliation=True it refuses publication. The grader rejects source_reconciled!=1.
    Initial unmatched count is zero.
