        with _con() as con:
            metrics = _recalculate(con, ecn_id, snapshot_date, metric_codes, ["avt_change_tracker", "yonyou_nc_erp", "teamcenter_plm"])
            unmatched = con.execute("SELECT COUNT(*) FROM source_reconciliation WHERE ecn_id=? AND event_date<=? AND reconciliation_result='unmatched'", (ecn_id, snapshot_date)).fetchone()[0]
            if require_reconciliation and unmatched:
