notes: >-
  Multi-turn RLVR environment (NeMo Gym, agent_ref=calendar_simple_agent). Full
  corpus audited structurally (3872 train + 128 val). Feasibility and trajectory
  checks are clean: all 4000 exp_cal_state instances admit a non-overlapping
  schedule within 10:00-16:00, and 0 of 42547 assistant turns contain
  overlapping events. Conflicts in user requests are frequent (72% of samples)
  but always soft/reschedulable; 0 hard/unsatisfiable. One grader-level
  candidate recorded (ER-f412381d, false-negative reward extraction). See
  runs/2026-10-20-audit. Intended for RL (RLVR), not SFT: records carry a
  verifier target (exp_cal_state) and no gold completion.
