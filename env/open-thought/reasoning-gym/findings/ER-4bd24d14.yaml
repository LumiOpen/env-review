validation:
  method: static
  summary: >
    Static reading of score_answer (sokoban.py lines 136–137) and
    player.update (player.py lines 15–26) confirms that non-RLUD characters
    are silently discarded. The loop iterates over the entire answer string
    character by character with no length limit or character filter. A brute-force
    response repeating "LRUD" N times will exhaustively explore a bounded grid
    and solve any solvable puzzle given sufficient N.
  assumptions:
    - No upstream length limit or character filter is applied to the answer before score_answer is called.
    - The puzzle is solvable (unsolvable puzzles cannot be bypassed by this method).
  not_run:
    - Empirical confirmation that a brute-force LRUD repetition solves a representative sample of generated puzzles.
    - Measurement of the answer length required to guarantee solution.
provenance:
  discovered_by: AI-assisted static code review, 2026-10-20
discussion: >
  Fix: filter answer to only RLUD characters before the loop, or add a
  maximum move count proportional to puzzle size. Either change prevents
  brute-force exploration while preserving valid move sequences.
