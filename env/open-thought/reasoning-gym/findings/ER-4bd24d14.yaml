title: sokoban silently ignores invalid move characters, allowing padding to solve any puzzle
status: confirmed
category: reward_shortcut
tasks:
  - id: sokoban
problem:
  description: >
    score_answer iterates over every character in the raw answer string and
    passes each to game.player.update(key=move). The player only acts on
    R/L/U/D; any other character sets move=None and returns 0 with no error.
    A model can embed a valid move sequence anywhere in an arbitrarily long
    response — prose, explanation, repeated characters — and the simulation
    will still complete the puzzle. Repeatedly cycling through valid moves
    (e.g. "LRUdlrudruldlrud..." thousands of times) will eventually solve
    any solvable puzzle.
  expected: >
    Only characters forming a valid move sequence (R, L, U, D) should be
    accepted. Invalid characters should either be rejected outright or cause
    the scoring to return 0.0.
  actual: >
    Line 136 iterates `for move in answer` over the raw string with no
    pre-filtering. player.update (player.py lines 15–26) silently no-ops
    on any character that is not R/L/U/D. Non-move characters consume no
    game state, so the simulation behaves as if they were absent.
