dataset: gh:open-thought/reasoning-gym
revision: 49b07130b3fcd12f2d064bba7c43869543a0e7e7
title: family_relationships ground truth has inverted relationship direction for in-law pairs
status: confirmed
category: incorrect_reference
tasks:
  - id: family_relationships
problem:
  description: >
    The ground truth for at least one confirmed question type returns the
    relationship from the wrong perspective. Concretely: for a graph where
    Sarah is Edward's wife and Elizabeth is Edward's mother, the question
    "What is Sarah to Elizabeth?" returns "mother-in-law" instead of the
    correct "daughter-in-law". The verifier compares model output against
    this inverted label, so a correct model answer receives 0 reward.
  expected: >
    The relationship label must reflect the direction stated in the question.
    Sarah's relation to Elizabeth (from Sarah's perspective) is daughter-in-law.
  actual: >
    The generator emits "mother-in-law" as the ground truth, which is
    Elizabeth's relation to Sarah, not Sarah's relation to Elizabeth.
    Any model that correctly answers "daughter-in-law" is penalized.
evidence:
  - source: reasoning_gym/algorithmic/family_relationships.py
    quote: >
      Relationship direction bug confirmed in upstream issue #535:
      "What is Sarah to Elizabeth?" where Sarah is Edward's wife and
      Elizabeth is Edward's mother returns "mother-in-law" instead of
      "daughter-in-law".
    note: "Issue URL: https://github.com/open-thought/reasoning-gym/issues/535"
validation:
  method: static
  summary: >
    Finding is based on open GitHub issue #535. The direction error is
    verifiable by manually tracing the relationship graph: Sarah→Edward
    (wife), Elizabeth→Edward (mother), therefore Sarah→Elizabeth =
    daughter-in-law. The generator appears to traverse the graph in the
    wrong direction for in-law pair lookups.
  assumptions:
    - The bug affects all generated items of the same in-law query form, not only one specific seed.
    - No post-generation correction step re-validates directionality.
  not_run:
    - Automated scan of all generated relationship types to enumerate all affected query forms.
    - End-to-end verification that the scoring path uses the inverted label.
provenance:
  discovered_by: open GitHub issue #535 (https://github.com/open-thought/reasoning-gym/issues/535); independently reviewed for this filing
discussion: >
  Linked upstream issue: https://github.com/open-thought/reasoning-gym/issues/535.
  Fix requires correcting the direction of in-law relationship traversal in the
  generator. Other multi-hop relationship types (e.g. uncle-in-law, cousin-in-law)
  may be affected by the same traversal bug and should be audited.
