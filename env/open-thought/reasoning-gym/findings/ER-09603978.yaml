    line_start: 117
    line_end: 117
    quote: |
      if oracle_answer in answer:
  - source: reasoning_gym/games/tsumego.py
    line_start: 295
    line_end: 295
    quote: |
      elif oracle_answer in answer:
validation:
  method: static
  summary: >
    Static reading of dataset.py lines 63–72 confirms the substring partial
    credit path. Tasks that override score_answer are unaffected; tasks using
    the default implementation inherit the shortcut. Confirmed duplicates in
    utils.py:117 and tsumego.py:295 by grep. The reward magnitude is bounded
    by len(oracle)/len(answer) and decreases as responses grow longer, which
    additionally incentivises concise responses that embed the oracle with
    minimal surrounding text.
  assumptions:
    - The affected tasks do not wrap score_answer in a cascade that would normalise or override this reward.
    - The model can observe and memorise oracle answers from the training distribution.
  not_run:
    - Enumeration of all tasks that use the default score_answer without overriding it.
    - RL training experiment measuring whether models learn to exploit substring inclusion.
provenance:
  discovered_by: AI-assisted static code review, 2026-10-20
discussion: >
  The substring branch may have been intended as a formatting-tolerance
  mechanism (accepting "The answer is 42" when oracle is "42"). A safer
  alternative is to strip common prefixes/suffixes and compare after
  normalisation, rather than awarding credit proportional to length ratio.
