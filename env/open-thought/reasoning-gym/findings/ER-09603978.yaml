title: default score_answer awards partial credit to any response containing the oracle answer as a substring
status: confirmed
category: reward_shortcut
tasks:
  - id: countdown
  - id: sokoban
  - id: puzzle24
problem:
  description: >
    The base ProceduralDataset.score_answer (dataset.py lines 63–72) awards
    partial credit proportional to len(oracle)/len(answer) whenever the oracle
    answer appears anywhere in the model's response string. Tasks that do not
    override score_answer inherit this behaviour. A model that learns to include
    the oracle answer verbatim in a long response — even surrounded by wrong
    reasoning — receives non-zero reward without solving the task.
  expected: >
    Partial credit should not be awarded to responses that merely contain the
    correct answer as a substring. An answer is either correct or it is not;
    length-scaled substring credit creates a reward signal for memorising
    oracle answers rather than reasoning to them.
  actual: >
    Line 70: `elif oracle_answer in answer: reward = len(oracle_answer) / len(answer)`.
    For a short oracle (e.g. "42") and a long response ("I am not sure but
    maybe 42 is the answer to everything"), reward = 2/50 = 0.04. This is
    non-zero and provides gradient signal toward including oracle substrings
    in output. The same pattern is duplicated in utils.py:117 and
    tsumego.py:295.
evidence:
  - source: reasoning_gym/dataset.py
    line_start: 63
    line_end: 72
    quote: |
      def score_answer(self, answer: Optional[str], entry: dict[str, Any]) -> float:
          """Overwrite this method in derived classes if a single oracle answer is not available."""
          oracle_answer = entry["answer"]
          reward = 0.0
          if isinstance(answer, str) and len(answer) > 0:
              if answer == oracle_answer:
                  reward = 1.0
              elif oracle_answer in answer:
                  reward = len(oracle_answer) / len(answer)
          return reward
