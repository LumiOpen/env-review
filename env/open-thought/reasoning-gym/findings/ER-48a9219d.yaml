schema_version: '1'
id: ER-48a9219d
dataset: gh:open-thought/reasoning-gym
revision: 49b07130b3fcd12f2d064bba7c43869543a0e7e7
title: syllogisms ground-truth labels are wrong for ~18% of items, rewarding fallacious reasoning
status: confirmed
category: incorrect_reference
tasks:
  - id: syllogisms
problem:
  description: >
    Approximately 18% of generated syllogism items have incorrect validity
    labels in the ground truth. Two specific argument forms are mislabeled
    as valid when they commit the undistributed-middle fallacy: (1)
    "All X are Y; Some Y are not Z ⊢ Some X are not Z" and (2)
    "All X are Y; Some Y are Z ⊢ Some X are Z". An RL agent trained on
    these items is positively rewarded for producing logically fallacious
    conclusions.
  expected: >
    The validity label stored at generation time must match the standard
    syllogistic validity rules. Both argument forms listed above are invalid
    (undistributed middle); their labels should be False/invalid.
  actual: >
    Both forms are stored with label True/valid. A model that correctly
    identifies them as invalid receives 0 reward, while a model that accepts
    the fallacy receives full reward.
evidence:
  - source: reasoning_gym/logic/syllogisms.py
    quote: |
      # Form: All X are Y; Some Y are not Z ⊢ Some X are not Z
      # Stored as valid=True — undistributed middle fallacy
    line_start: 1
    line_end: 2
    note: >
      Upstream issue #536 reports ~18% of items are affected and identifies two
      specific mislabeled argument forms. Issue URL:
      https://github.com/open-thought/reasoning-gym/issues/536
validation:
  method: static
  summary: >
    Finding is based on open GitHub issue #536, which identifies the two
    specific argument forms and the undistributed-middle fallacy. The 18%
    prevalence estimate comes from the issue reporter. The logic error is
    independently verifiable with a truth-table or standard syllogistic
    validity checker: both argument forms have countermodels.
  assumptions:
    - Labels are computed at generation time and not re-validated at scoring time.
    - The two mislabeled forms appear with non-negligible frequency in generated items.
  not_run:
    - Automated full-corpus scan to independently verify 18% prevalence.
    - End-to-end RL training experiment measuring reasoning degradation.
  reproducer: >
    Countermodel for form 2 (All X are Y; Some Y are Z ⊢ Some X are Z):
    Let X={cats}, Y={animals}, Z={dogs}. All cats are animals. Some animals
    are dogs. But no cats are dogs — conclusion false, argument invalid.
provenance:
  discovered_by: open GitHub issue #536 (https://github.com/open-thought/reasoning-gym/issues/536); independently reviewed for this filing
discussion: >
  Linked upstream issue: https://github.com/open-thought/reasoning-gym/issues/536.
  This is the highest-severity finding because it inverts the reward signal for
  specific logical forms, actively training models to commit named fallacies.
  Fix requires regenerating labels with a validated syllogistic checker or
  filtering the two affected forms until the generation is corrected.
